      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh Release

      - name: Validate Chinese language bundle
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile("build/GoldenNuggetMobile.ipa") as archive:
              assert archive.testzip() is None
              app = "Payload/GoldenNuggetMobile.app/"
              info = plistlib.loads(archive.read(app + "Info.plist"))
              assert info["CFBundleShortVersionString"] == "9.5.3"
              assert set(info["CFBundleLocalizations"]) == {"en", "zh-Hans"}
              en = plistlib.loads(archive.read(app + "en.lproj/Localizable.strings"))
              zh = plistlib.loads(archive.read(app + "zh-Hans.lproj/Localizable.strings"))
              assert en.keys() == zh.keys() and len(zh) >= 509
              for key in ("Tweaks", "Supported!", "Apply", "Reset Tweaks", "Settings"):
                  assert zh[key] != key
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoldenNuggetMobile-9.5.3-zh-Hans-unsigned
          path: build/GoldenNuggetMobile.ipa
          if-no-files-found: error
